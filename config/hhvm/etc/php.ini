; php options
include_path = ".:/vue-msf/hhvm/lib64/hhvm/"
memory_limit = 2G

; hhvm specific 
hhvm.log.level = Info
; hhvm.log.level = Warning
hhvm.log.header = true
hhvm.log.always_log_unhandled_exceptions = true
hhvm.log.runtime_error_reporting_level = 8191
hhvm.mysql.typed_results = false

;hhvm.log.use_syslog = true

hhvm.log.native_stack_trace = true
hhvm.log.max_messages_per_request = 1000

hhvm.log.use_log_file = true
hhvm.log.file = /vue-msf/data/hhvm/log/error.log
hhvm.log.access.file = /vue-msf/data/hhvm/log/access.log

; hhvm dynamic extensions
hhvm.dynamic_extensions[mongodb] = /vue-msf/hhvm/lib64/hhvm/extensions/20150212/mongodb.so
hhvm.dynamic_extensions[mongo] = /vue-msf/hhvm/lib64/hhvm/extensions/20150212/mongo.so